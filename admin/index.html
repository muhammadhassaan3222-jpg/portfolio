<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script src="../js/content.js"></script><script src="../js/site-data.js"></script><script src="../js/theme.js"></script>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="lform" class="lcard">
    <h1>Admin Panel</h1><p>Sign in to manage your website.</p>
    <label>Username<input id="lu" autocomplete="username" required></label>
    <label>Password<input id="lp" type="password" autocomplete="current-password" required></label>
    <p id="lerr" class="lerr" role="alert"></p>
    <button class="btn primary" type="submit">Log in</button>
  </form>
</div>
<div id="app" class="app" hidden>
  <aside id="side" class="side"></aside>
  <main class="main">
    <header class="top"><h2 id="ttl">Dashboard</h2><div class="tright"><span id="dstat" class="dstat">All changes saved</span><a class="btn ghost" href="../index.html" target="_blank" rel="noopener">View website</a><button id="save" class="btn primary" disabled>Save changes</button></div></header>
    <div id="warn" class="warn" hidden></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="admin.js"></script>
</body>
</html>
