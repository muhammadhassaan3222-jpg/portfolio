<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hassan | UGC Ads Creator</title>
<meta name="description" content="UGC ads for brands: authentic, scroll-stopping short-form video for TikTok, Instagram Reels and Facebook.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/site-data.js"></script><script src="js/theme.js"></script>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<header id="nav" class="nav">
  <a id="nav-logo" class="logo" href="index.html">Hassan.</a>
  <nav id="nav-links" class="links" aria-label="Main"></nav>
  <a id="nav-cta" class="btn primary sm" href="contact.html">Work With Me</a>
  <button id="menu-btn" class="menu" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
</header>
<main>
  <section class="hero wrap">
    <div id="hero-copy" class="hero-copy"></div>
    <div id="hero-visual" class="hero-visual"></div>
  </section>

  <section class="stats wrap rv"><div id="stats-grid" class="stats-grid"></div></section>

  <section class="sec wrap rv" id="services">
    <h2>What I create for brands</h2>
    <div id="services-grid" class="grid3"></div>
  </section>

  <section class="sec wrap rv" id="work">
    <div class="head"><h2>Featured UGC work</h2><a class="btn ghost sm" href="portfolio.html">View Full Portfolio</a></div>
    <div id="work-grid" class="work"></div>
    <p class="center"><a class="btn primary" href="portfolio.html">View Full Portfolio</a></p>
  </section>

  <section class="sec wrap rv" id="why">
    <h2>Why brands work with me</h2>
    <div id="why-grid" class="why-grid"></div>
  </section>

  <section class="sec wrap rv" id="testimonials">
    <h2>What clients say</h2>
    <div class="slider">
      <div class="viewport"><div id="t-track" class="track"></div></div>
      <div class="ctrl"><button id="t-prev" aria-label="Previous">&#8592;</button><div id="t-dots" class="dots"></div><button id="t-next" aria-label="Next">&#8594;</button></div>
    </div>
  </section>

  <section class="sec brands rv" aria-label="Brands I've worked with">
    <h2 class="wrap">Brands I've worked with</h2>
    <div id="marquee" class="marquee"></div>
  </section>

  <section class="sec wrap rv" id="process">
    <h2>How it works</h2>
    <ol id="steps" class="steps"></ol>
  </section>

  <section class="sec wrap rv"><div id="cta-box" class="ctabox"></div></section>
</main>
<footer class="foot">
  <div class="wrap"><div id="footer-grid" class="fgrid"></div><p id="copy" class="copy"></p></div>
</footer>
<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
